# Reduced-montage ablation (Table 7): standard 19-electrode 10-20 subset of the
# 26-channel layout, retrained with the matching electrode coordinates.
# Identical to configs/neurobolt.yaml except the channel set.

name: boldflow_montage_19
seed: 12345
device: cuda
output_dir: ./outputs/boldflow_montage_19

k_folds: 5
folds: [1, 2, 3, 4, 5]

# Pretrained REVE encoder. `python scripts/download_pretrained.py` puts it
# at ./checkpoints/reve-base.safetensors. Set to null to train from scratch.
pretrained_encoder: ./checkpoints/reve-base.safetensors

model:
  n_channels: 19
  input_length: 6400          # 32 s at 200 Hz
  n_rois: 64                  # DiFuMo parcels per TR
  n_out_timesteps: 4          # seq2seq horizon T_out (paper headline)
  embed_dim: 512
  velocity_layers: 4
  n_inference_steps: 50       # Euler steps at test time
  prior_beta: 0.5             # Seitzer (2022) beta-NLL
  prior_loss_weight: 1.0      # lambda: weight on L_prior (paper Eq. 5)
  prior_sigma_floor: 0.05
  prior_init_sigma: 0.2

training:
  epochs: 30
  batch_size: 32              # safe on a 40 GB A100
  lr: 1.0e-4
  weight_decay: 0.01
  warmup_epochs: 3
  layer_decay: 1.0            # paper uses no layer-wise LR decay
  max_grad_norm: 2.0
  mixed_precision: true
  early_stopping_patience: 10

data:
  dataset: neurobolt
  data_root: /path/to/neurobolt   # CHANGE ME (or set BOLDFLOW_DATA_ROOT)
  n_rois: 64
  multi_roi: true
  tr: 2.1
  tmin: -32.0
  tmax: 0.0
  apply_eeg_filter: true
  apply_fmri_filter: true
  normalize_eeg: true
  channels: [FP1, FP2, F7, F3, FZ, F4, F8, T7, C3, CZ, C4, T8, P7, P3, PZ, P4, P8, O1, O2]
  exclude_non_neural: false
  num_workers: 4
  pin_memory: true
