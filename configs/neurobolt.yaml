# BOLDFlow on NeuroBOLT (Table 1, main-comparison configuration).
#
# data.data_root resolution order (any of these works):
#   1. --data-root <path> on the command line
#   2. BOLDFLOW_DATA_ROOT environment variable
#   3. data.data_root in this file (the placeholder below)

name: boldflow_neurobolt
seed: 12345
device: cuda
output_dir: ./outputs/boldflow_neurobolt

k_folds: 5
folds: [1, 2, 3, 4, 5]

# Pretrained REVE encoder. `python scripts/download_pretrained.py` puts it
# at ./checkpoints/reve-base.safetensors. Set to null to train from scratch.
pretrained_encoder: ./checkpoints/reve-base.safetensors

model:
  n_channels: 26
  input_length: 6400          # 32 s at 200 Hz
  n_rois: 64                  # DiFuMo parcels per TR
  n_out_timesteps: 4          # seq2seq horizon T_out
  embed_dim: 512
  velocity_layers: 4
  n_inference_steps: 50       # Euler steps at test time
  prior_beta: 0.5             # Seitzer (2022) beta-NLL
  prior_loss_weight: 1.0      # lambda: weight on L_prior (paper Eq. 5)
  prior_sigma_floor: 0.05
  prior_init_sigma: 0.2

training:
  epochs: 30
  batch_size: 32
  lr: 1.0e-4
  weight_decay: 0.01
  warmup_epochs: 3
  max_grad_norm: 2.0
  mixed_precision: true
  early_stopping_patience: 10

data:
  dataset: neurobolt
  data_root: /path/to/neurobolt   # or set BOLDFLOW_DATA_ROOT / --data-root
  n_rois: 64
  tr: 2.1
  tmin: -32.0
  tmax: 0.0
  apply_eeg_filter: true
  apply_fmri_filter: true
  normalize_eeg: true
  num_workers: 4
  pin_memory: true
