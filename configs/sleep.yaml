# BOLDFlow on OpenNeuroSleep (paper Table 1).
# Same architecture as the NeuroBOLT config; differences are dataset, channel
# count, and an extra EEG lowpass.
# Reproduces: MSE = 0.255,  T.Corr = 0.212 +/- 0.001,  FC Corr = 0.528 +/- 0.017
#
# data.data_root: pass --data-root, set BOLDFLOW_DATA_ROOT, or edit below.

name: boldflow_sleep
seed: 12345
device: cuda
output_dir: ./outputs/boldflow_sleep

k_folds: 5
folds: [1, 2, 3, 4, 5]

pretrained_encoder: ./checkpoints/reve-base.safetensors

model:
  n_channels: 30          # OpenNeuroSleep has 30 EEG channels
  input_length: 6400
  n_rois: 64              # DiFuMo parcels per TR
  n_out_timesteps: 4      # seq2seq horizon T_out (paper headline)
  embed_dim: 512
  velocity_layers: 4
  n_inference_steps: 50
  prior_beta: 0.5
  prior_loss_weight: 1.0
  prior_sigma_floor: 0.05
  prior_init_sigma: 0.2

training:
  epochs: 30
  batch_size: 32
  lr: 1.0e-4
  weight_decay: 0.01
  warmup_epochs: 3
  layer_decay: 1.0
  max_grad_norm: 2.0
  mixed_precision: true
  early_stopping_patience: 10

data:
  dataset: sleep
  data_root: /path/to/openneurosleep   # CHANGE ME (or set BOLDFLOW_DATA_ROOT)
  n_rois: 64
  multi_roi: true
  tr: 2.1
  tmin: -32.0
  tmax: 0.0
  apply_eeg_filter: true
  apply_fmri_filter: true
  normalize_eeg: true
  eeg_lowpass: 70.0       # extra lowpass for sleep EEG
  exclude_non_neural: false
  num_workers: 4
  pin_memory: true
