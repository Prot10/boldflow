[project]
name = "boldflow"
version = "1.0.0"
description = "Network-Level EEG-to-fMRI Synthesis via Conditional Flow Matching"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["eeg", "fmri", "deep-learning", "neuroscience", "flow-matching"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "linear-attention-transformer>=0.19.1",
    "safetensors>=0.4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
data = [
    "mne>=1.6.0",
]
pretrained = [
    "huggingface-hub>=0.20.0",
]
figures = [
    "matplotlib>=3.7.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]
all = [
    "boldflow[data,pretrained,figures,dev]",
]

[project.urls]
Repository = "https://anonymous.4open.science/r/boldflow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["boldflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]
